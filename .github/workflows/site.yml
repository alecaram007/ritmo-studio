# Publishes the website (site/) to GitHub Pages: the landing pages in Italian and English, the online app,
# sitemap and social images. Download links and file sizes come from the release of the current version.
name: Website

on:
  workflow_dispatch:  # the installer build starts it once the files are in the release
  push:
    branches: [main]
    paths: ['site/**', 'RitmoStudio.html', 'desktop/package.json', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 site/build.py --base "${{ vars.SITE_BASE || steps.pages.outputs.base_url }}" --repo "${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_out
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Tell Bing and other IndexNow search engines about the update
        env:
          BASE: ${{ vars.SITE_BASE || steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          out = 'site/_out'
          keys = [f[:-4] for f in os.listdir(out) if re.fullmatch(r'[0-9a-f]{32}\.txt', f)]
          if not keys:
              raise SystemExit(0)
          base = os.environ['BASE'].rstrip('/')
          urls = re.findall(r'<loc>([^<]+)</loc>', open(f'{out}/sitemap.xml').read())
          body = json.dumps({'host': base.split('/')[2], 'key': keys[0], 'keyLocation': f'{base}/{keys[0]}.txt', 'urlList': urls}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', body, {'Content-Type': 'application/json; charset=utf-8'})
          try:
              print('IndexNow:', urllib.request.urlopen(req, timeout=30).status, f'({len(urls)} pages)')
          except Exception as e:  # a refused ping must not fail the deploy
              print('IndexNow not reached:', e)
          PY

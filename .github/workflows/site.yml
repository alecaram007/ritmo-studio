# Publishes the website (site/) to GitHub Pages: the landing pages in Italian and English, the online app,
# sitemap and social images. Download links and file sizes come from the release of the current version.
name: Website

on:
  workflow_dispatch:  # the installer build starts it once the files are in the release
  push:
    branches: [main]
    paths: ['site/**', 'RitmoStudio.html', 'desktop/package.json', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 site/build.py --base "${{ vars.SITE_BASE || steps.pages.outputs.base_url }}" --repo "${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_out
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Tell Bing and other IndexNow search engines about the update
        env:
          BASE: ${{ vars.SITE_BASE || steps.pages.outputs.base_url }}
        run: |
          KEY=$(ls site/_out | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | cut -d. -f1)
          [ -n "$KEY" ] || exit 0
          HOST=$(echo "$BASE" | cut -d/ -f3)
          curl -sS -o /dev/null -w 'IndexNow: %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"$BASE/$KEY.txt\",\"urlList\":[\"$BASE/\",\"$BASE/en/\",\"$BASE/app/\"]}" || true
